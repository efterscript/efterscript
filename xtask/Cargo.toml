[package]
name = "xtask"
description = "cargo xtask automation for the EfterScript workspace"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["resident-outlines"]
# The resident set's outline assets; forwarded so a build without them
# can switch them off for every crate at once.
resident-outlines = ["ps-vm/resident-outlines"]

[dependencies]
ps-vm.workspace = true
