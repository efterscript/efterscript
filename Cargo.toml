[workspace]
resolver = "3"
members = [
    "crates/ps-vm",
    "crates/ps-graphics",
    "crates/ps-fonts",
    "crates/pdf-out",
    "crates/codec",
    "crates/remelt",
    "crates/platen",
    "crates/efterscript-cli",
    "tools/psgen",
    "tools/difftest",
    "xtask",
]
# The fuzz crate depends on libfuzzer-sys and builds only with nightly
# `cargo fuzz`; keeping it out of the workspace keeps stable builds clean.
exclude = ["crates/ps-vm/fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/efterscript/efterscript"
rust-version = "1.98"

[workspace.dependencies]
# Default features are off here and re-enabled by each member's own
# `default` feature (`resident-outlines`), so that
# `cargo build --workspace --no-default-features` really turns them off.
ps-vm = { path = "crates/ps-vm", default-features = false }
ps-graphics = { path = "crates/ps-graphics", default-features = false }
ps-fonts = { path = "crates/ps-fonts", default-features = false }
pdf-out = { path = "crates/pdf-out" }
codec = { path = "crates/codec" }
remelt = { path = "crates/remelt", default-features = false }
platen = { path = "crates/platen" }
