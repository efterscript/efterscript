[workspace]
resolver = "3"
members = [
    "crates/efterscript-vm",
    "crates/efterscript-graphics",
    "crates/efterscript-fonts",
    "crates/efterscript-pdf",
    "crates/efterscript-codec",
    "crates/efterscript-remelt",
    "crates/efterscript-platen",
    "crates/efterscript",
    "crates/efterscript-cli",
    "tools/psgen",
    "tools/difftest",
    "xtask",
]
# The fuzz crates depend on libfuzzer-sys and run only under nightly
# `cargo fuzz`; keeping them out of the workspace keeps stable builds
# clean. `cargo xtask fuzz-smoke` checks and runs them.
exclude = [
    "crates/efterscript-codec/fuzz",
    "crates/efterscript-vm/fuzz",
    "crates/efterscript-fonts/fuzz",
    "crates/efterscript-remelt/fuzz",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/efterscript/efterscript"
readme = "README.md"
rust-version = "1.98"

[workspace.dependencies]
# Default features are off here and re-enabled by each member's own
# `default` feature (`resident-outlines`), so that
# `cargo build --workspace --no-default-features` really turns them off.
efterscript-vm = { version = "0.0.1", path = "crates/efterscript-vm", default-features = false }
efterscript-graphics = { version = "0.0.1", path = "crates/efterscript-graphics", default-features = false }
efterscript-fonts = { version = "0.0.1", path = "crates/efterscript-fonts", default-features = false }
efterscript-pdf = { version = "0.0.1", path = "crates/efterscript-pdf" }
efterscript-codec = { version = "0.0.1", path = "crates/efterscript-codec" }
efterscript-remelt = { version = "0.0.1", path = "crates/efterscript-remelt", default-features = false }
efterscript-platen = { version = "0.0.1", path = "crates/efterscript-platen", default-features = false }
efterscript = { version = "0.0.1", path = "crates/efterscript", default-features = false }
