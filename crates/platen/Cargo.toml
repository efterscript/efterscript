[package]
name = "platen"
description = "Virtual-printer session front-end: printer identity, statusdict, query handling, back channel, job protocol framing"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["resident-outlines"]
# The resident set's outline assets; forwarded so a build without them
# can switch them off for every crate at once.
resident-outlines = ["remelt/resident-outlines"]

[dependencies]
remelt.workspace = true
