[package]
name = "platen"
description = "Session front-end: a job fed in pieces with replies and error reports read back, a PDF at the end, and a C ABI for hosts that act as a printer"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = ["resident-outlines"]
# The resident set's outline assets; forwarded so a build without them
# can switch them off for every crate at once.
resident-outlines = ["remelt/resident-outlines"]

[dependencies]
remelt.workspace = true
ps-vm.workspace = true

[dev-dependencies]
codec.workspace = true
proptest = "1.11.0"
