[package]
name = "remelt"
description = "The distillation engine: drives the VM, consumes IR, applies policies (recompression, font embedding, color strategy, pdfmark), writes PDF"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["resident-outlines"]
# The resident set's outline assets; forwarded so a build without them
# can switch them off for every crate at once.
resident-outlines = ["ps-vm/resident-outlines", "ps-graphics/resident-outlines", "ps-fonts/resident-outlines"]

[dependencies]
ps-vm.workspace = true
ps-graphics.workspace = true
ps-fonts.workspace = true
pdf-out.workspace = true

[dev-dependencies]
codec.workspace = true
proptest = "1.11.0"
