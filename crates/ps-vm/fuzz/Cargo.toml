[package]
name = "ps-vm-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata]
cargo-fuzz = true

# Standalone: nightly-only, see the root manifest's `exclude`.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
ps-vm = { path = ".." }

[[bin]]
name = "scan"
path = "fuzz_targets/scan.rs"
test = false
doc = false
bench = false
