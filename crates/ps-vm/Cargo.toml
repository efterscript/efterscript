[package]
name = "ps-vm"
description = "PostScript language VM: scanner, object model, stacks, dictionaries, save/restore, resources, error semantics; graphics operators dispatched behind a trait"
# Private-phase name; published crates use the `efterscript-*` prefix.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["resident-outlines"]
# The resident set's outline assets; forwarded so a build without them
# can switch them off for every crate at once.
resident-outlines = ["ps-fonts/resident-outlines"]

[dependencies]
ps-fonts.workspace = true

[dev-dependencies]
proptest = "1.11.0"
