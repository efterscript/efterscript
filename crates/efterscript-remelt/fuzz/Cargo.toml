[package]
name = "efterscript-remelt-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata]
cargo-fuzz = true

# Standalone: nightly-only, see the root manifest's `exclude`.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
efterscript-remelt = { path = ".." }
efterscript-vm = { path = "../../efterscript-vm" }

[[bin]]
name = "distill"
path = "fuzz_targets/distill.rs"
test = false
doc = false
bench = false
