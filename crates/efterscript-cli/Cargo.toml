[package]
name = "efterscript-cli"
description = "PostScript-to-PDF command-line tool for EfterScript"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "efterscript"
path = "src/main.rs"

[features]
default = ["resident-outlines"]
# The resident set's outline assets; forwarded so a build without them
# can switch them off for every crate at once.
resident-outlines = ["ps-vm/resident-outlines", "ps-graphics/resident-outlines", "remelt/resident-outlines"]

[dependencies]
ps-vm.workspace = true
ps-graphics.workspace = true
remelt.workspace = true
