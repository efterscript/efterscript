[package]
name = "ps-fonts"
description = "Type 1 / CFF / TrueType (Type 42) parsing, metrics, charstring-to-outline extraction, subsetting, and ToUnicode derivation"
# Private-phase name; published crates use the `efterscript-*` prefix.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["resident-outlines"]
# Embeds the Liberation and TeX Gyre outline programs of the resident
# set (about seven megabytes); off, the faces keep their metrics only.
resident-outlines = []

[dependencies]
