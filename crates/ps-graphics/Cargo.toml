[package]
name = "ps-graphics"
description = "Graphics-state machine producing a PDF-shaped, resolution-independent vector IR; sink traits for pluggable backends"
# Private-phase name; published crates use the `efterscript-*` prefix.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ps-vm.workspace = true
ps-fonts.workspace = true

[dev-dependencies]
# Only to check that the dump's real syntax agrees with the PDF writer's;
# the library itself knows nothing about PDF.
pdf-out.workspace = true
proptest = "1.11.0"
