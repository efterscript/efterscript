[package]
name = "psgen"
description = "Property-based PostScript program generator: grammar, oracle-free properties, shrinking"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["resident-outlines"]
# The resident set's outline assets; forwarded so a build without them
# can switch them off for every crate at once.
resident-outlines = ["ps-vm/resident-outlines", "ps-graphics/resident-outlines", "remelt/resident-outlines", "ps-fonts/resident-outlines"]

[dependencies]
ps-fonts.workspace = true
ps-vm.workspace = true
ps-graphics.workspace = true
remelt.workspace = true
