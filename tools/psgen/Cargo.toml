[package]
name = "psgen"
description = "Property-based generator of programs in the PostScript language: grammar, oracle-free properties, shrinking"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["resident-outlines"]
# The resident set's outline assets; forwarded so a build without them
# can switch them off for every crate at once.
resident-outlines = ["efterscript-vm/resident-outlines", "efterscript-graphics/resident-outlines", "efterscript-remelt/resident-outlines", "efterscript-fonts/resident-outlines"]

[dependencies]
efterscript-fonts.workspace = true
efterscript-vm.workspace = true
efterscript-graphics.workspace = true
efterscript-remelt.workspace = true
