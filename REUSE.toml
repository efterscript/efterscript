# SPDX-License-Identifier: MIT
#
# REUSE annotations for the third-party font assets, which ship
# byte-identical to upstream and cannot carry headers of their own. Their
# origin and checksums are in crates/efterscript-fonts/data/PROVENANCE.md. The
# `.metrics` tables beside the TeX Gyre programs are the project's own
# derived data and carry their headers in comment lines, so the
# annotation below names the upstream files by extension.

version = 1

[[annotations]]
path = "crates/efterscript-fonts/data/outlines/liberation/**"
precedence = "aggregate"
SPDX-FileCopyrightText = [
    "2010 Google Corporation (digitized data)",
    "2012 Red Hat, Inc.",
]
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
    "crates/efterscript-fonts/data/outlines/tex-gyre/*.pfb",
    "crates/efterscript-fonts/data/outlines/tex-gyre/*.txt",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2007-2018 B. Jackowski, J.M. Nowacki, et al. (GUST e-foundry), for the TeX Gyre extensions"
SPDX-License-Identifier = "LPPL-1.3c"

[[annotations]]
path = "crates/efterscript-fonts/data/cmap/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "1990-2023 Adobe"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = "crates/efterscript-fonts/data/core14/*.afm"
precedence = "aggregate"
SPDX-FileCopyrightText = "1985-1997 Adobe Systems Incorporated"
SPDX-License-Identifier = "LicenseRef-Adobe-AFM"

[[annotations]]
path = "crates/efterscript-fonts/data/glyphlist.txt"
precedence = "aggregate"
SPDX-FileCopyrightText = "2002-2019 Adobe"
SPDX-License-Identifier = "BSD-3-Clause"

# The project's own documents, specifications, configuration, and tooling,
# whose formats carry no comment header: MIT like the code. Licence texts
# under LICENSES/ and lock/ignore files are not works of this project and
# are listed only so the map is complete.
[[annotations]]
path = [
    "openspec/**",
    ".claude/**",
    ".devcontainer/**",
    ".githooks/**",
    "README.md",
    "corpus/README.md",
    "corpus/**/.gitkeep",
    ".gitignore",
    "**/.gitignore",
    "Cargo.lock",
    "crates/*/tests/*.proptest-regressions",
    "crates/efterscript-fonts/data/PROVENANCE.md",
    "corpus/golden/pdf/one-page.pdf",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 EfterScript contributors"
SPDX-License-Identifier = "MIT"
