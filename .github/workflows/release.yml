# SPDX-License-Identifier: MIT
#
# A release: pushing a tag `v<X.Y.Z>` that names the workspace version.
# `verify` reruns the public tier on the tagged commit with no
# privileges; `publish` runs in the `release` environment (a reviewer
# must approve it), proves this workflow's identity to the registry
# through GitHub's OpenID Connect token, receives a registry token that
# lives only for the job, and publishes the nine crates in dependency
# order, skipping any version the registry already holds. No registry
# credential is stored anywhere.

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: The tag must name the workspace version
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          tag="${GITHUB_REF_NAME}"
          echo "workspace version: ${version}; tag: ${tag}"
          if [ "${tag}" != "v${version}" ]; then
            echo "::error::tag ${tag} does not name the workspace version ${version}"
            exit 1
          fi

      - name: Read the pinned toolchain
        id: toolchain
        run: echo "version=$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          components: rustfmt, clippy
          cache: false

      - run: rustup target add wasm32-unknown-emscripten
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Corpus goldens are byte-identical
        run: |
          cargo run -q -p difftest -- run
          git diff --exit-code -- corpus/golden
      - run: cargo run -q -p xtask -- parse-survival
      - run: cargo run -q -p xtask -- fuzz-round
      - run: cargo build --workspace --no-default-features
      - run: cargo run -q -p xtask -- check-wasm
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Every crate packages from the tagged tree
        run: |
          cargo package --workspace
          # The per-crate verify builds under target/package are gone by
          # now; remove the directory so the cache's post-run prune does
          # not walk paths that no longer exist (ENOENT annotations).
          rm -rf target/package

  # The session library archives. Three build jobs, one per platform,
  # each checking its archive by linking and running a small host where
  # it will be used; one attach job collects them, writes the single
  # SHA256SUMS the consumers verify against, and attaches everything.
  host-archive:
    name: Build the host archive (${{ matrix.triple }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - triple: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    env:
      RUST_VERSION: "1.98.0"
    steps:
      - uses: actions/checkout@v4

      - name: The tag names the workspace version
        id: meta
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "::error::tag/version mismatch"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache: false

      - name: Build the host archive
        run: |
          [ "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.triple }}" ] || { echo "::error::runner is not ${{ matrix.triple }}"; exit 1; }
          cargo build --release -p efterscript-platen
          ls -la target/release/libplaten.a

      - name: Link and run a minimal host against the archive
        run: |
          cat > /tmp/host.c <<'EOC'
          #include <stdio.h>
          #include <string.h>
          #include "platen.h"
          int main(void) {
              platen_config cfg;
              memset(&cfg, 0, sizeof cfg);
              cfg.abi_version = PLATEN_ABI_VERSION;
              platen_job *job = platen_job_new(&cfg);
              if (!job) { printf("new failed: %s\n", platen_last_error()); return 1; }
              const char *program = "%!PS\n0 0 moveto 100 100 lineto stroke showpage\n";
              platen_job_feed(job, (const uint8_t *)program, strlen(program));
              platen_job_finish(job);
              printf("pages=%u\n", (unsigned)platen_job_pages(job));
              platen_job_free(job);
              return 0;
          }
          EOC
          # The system libraries a Rust staticlib needs on Linux
          # (cargo rustc -- --print native-static-libs).
          cc -O1 -I crates/efterscript-platen/include /tmp/host.c target/release/libplaten.a \
            -lgcc_s -lutil -lrt -lpthread -lm -ldl -lc -o /tmp/host
          /tmp/host | tee /tmp/host.out
          grep -q '^pages=1$' /tmp/host.out

      - name: Name the archive
        run: |
          mkdir -p dist
          cp target/release/libplaten.a "dist/libplaten-${{ steps.meta.outputs.version }}-${{ matrix.triple }}.a"

      - uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.triple }}
          path: dist/*
          if-no-files-found: error

  wasm-archive:
    name: Build the Emscripten archive
    needs: verify
    runs-on: ubuntu-latest
    env:
      # The Rust toolchain and the Emscripten SDK are a pair: Rust's
      # prebuilt standard library for wasm32-unknown-emscripten is built
      # with the SDK that was current on the toolchain's build date, and
      # Emscripten's ABI is not semantically versioned. Change them
      # together; the link check below catches a mismatch before upload.
      RUST_VERSION: "1.98.0"
      EMSDK_VERSION: "6.0.7"
    steps:
      - uses: actions/checkout@v4

      - name: The tag names the workspace version
        id: meta
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "::error::tag/version mismatch"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: wasm32-unknown-emscripten
          cache: false

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Build the Emscripten archive
        run: |
          emcc --version | head -1
          cargo build --release -p efterscript-platen --target wasm32-unknown-emscripten
          ls -la target/wasm32-unknown-emscripten/release/libplaten.a

      - name: Link and run a minimal host against the Emscripten archive
        run: |
          cat > /tmp/host.c <<'EOC'
          #include <stdio.h>
          #include <string.h>
          #include "platen.h"
          int main(void) {
              platen_config cfg;
              memset(&cfg, 0, sizeof cfg);
              cfg.abi_version = PLATEN_ABI_VERSION;
              platen_job *job = platen_job_new(&cfg);
              if (!job) { printf("new failed: %s\n", platen_last_error()); return 1; }
              const char *program = "%!PS\n0 0 moveto 100 100 lineto stroke showpage\n";
              platen_job_feed(job, (const uint8_t *)program, strlen(program));
              platen_job_finish(job);
              printf("pages=%u\n", (unsigned)platen_job_pages(job));
              platen_job_free(job);
              return 0;
          }
          EOC
          emcc -O1 -fwasm-exceptions -sWASM_LEGACY_EXCEPTIONS=1 -s ALLOW_MEMORY_GROWTH=1 -I crates/efterscript-platen/include \
            /tmp/host.c target/wasm32-unknown-emscripten/release/libplaten.a -o /tmp/host.js
          node /tmp/host.js | tee /tmp/host.out
          grep -q '^pages=1$' /tmp/host.out

      - name: Name the archive and the header
        run: |
          v="${{ steps.meta.outputs.version }}"
          mkdir -p dist
          cp target/wasm32-unknown-emscripten/release/libplaten.a \
             "dist/libplaten-${v}-wasm32-unknown-emscripten-${EMSDK_VERSION}.a"
          cp crates/efterscript-platen/include/platen.h "dist/platen-${v}.h"

      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: dist/*
          if-no-files-found: error

  attach:
    name: Attach the archives to the release
    needs: [host-archive, wasm-archive]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: One checksum file over everything
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          ls -la dist
          cat dist/SHA256SUMS

      - name: Attach to the release of the tag
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: false

  publish:
    name: Publish to the registry
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned toolchain
        id: toolchain
        run: echo "version=$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          cache: false

      - name: Authenticate through trusted publishing
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish in dependency order, resuming past crates already up
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -eu
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          published() {
            curl -sf -A "efterscript-release" \
              "https://crates.io/api/v1/crates/$1/${version}" > /dev/null
          }
          for crate in efterscript-codec efterscript-pdf efterscript-fonts \
                       efterscript-vm efterscript-graphics efterscript-remelt \
                       efterscript-platen efterscript efterscript-cli; do
            if published "${crate}"; then
              echo "${crate} ${version} is already on the registry; skipping"
              continue
            fi
            cargo publish -p "${crate}"
            for attempt in $(seq 1 30); do
              published "${crate}" && break
              sleep 10
            done
            published "${crate}" || {
              echo "::error::${crate} ${version} did not appear on the registry"
              exit 1
            }
          done
